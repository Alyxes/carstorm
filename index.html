<!DOCTYPE html>
<html>
  <head>
    <title>Carstorm!</title>
    <meta charset="utf-8" />
    
    <link rel="manifest" href="./app.webmanifest">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link 
      rel="preload" 
      href="fonts/SkitserSwift.ttf" 
      as="font" 
      type="font/ttf" 
      crossorigin="anonymous" />
    <link 
      rel="preload" 
      href="fonts/Snowstorm.ttf" 
      as="font" 
      type="font/ttf" 
      crossorigin="anonymous" />
    <link 
      rel="preload" 
      href="fonts/Again.ttf" 
      as="font" 
      type="font/ttf" 
      crossorigin="anonymous" />
  </head>
<style>
  html, body
  {
    -webkit-user-select:none;
    background-color: #777799;
    overscroll-behavior-y: contain;
      
    touch-action: pan-x pan-y;
  }
  @font-face
  {
    font-family: 'CarStormFont1';
    src: url('fonts/SkitserSwift.ttf');
    
  }
  @font-face
  {
    font-family: 'CarStormFont2';
    src: url('fonts/Snowstorm.ttf');
  }
  @font-face
  {
    font-family: 'CarStormFont3';
    src: url('fonts/Again.ttf');
  }
  #canvas, #street_canvas, #top_canvas
  {
    position:absolute;
    top:0px;
    left:0px;
  }
  #offline_message
  {
    color: white;
    font-size: 32px;
    display: none;
  }
</style>
<body onLoad="Setup();">
  <p id="offline_message">If nothing shows up, please make sure you are online the first time you start the game!</p>
	<canvas id="canvas"></canvas>
  <canvas id="street_canvas"></canvas>
  <canvas id="top_canvas"></canvas>
  
  <script>
    if (navigator.userActivation.isActive)
    {
      console.log("is active");
    }
    else
    {
      console.log("not active");
    }
    
    var GameVersionToDownload = 0;
    var scripts = ["button.js","carstorm.js"];
    var readyCount = 0;

    function Setup()
    {
      ReadLocalStorage();

      scripts.forEach(function(src) {
        var script = document.createElement('script');
        script.src = src + "?cache_killer=" + GameVersionToDownload;
        script.async = false;
        
        console.log(script.src);
        
        document.head.appendChild(script);      
      });
    }
    
    function ReadLocalStorage()
    {
      GameVersionToDownload = parseInt(localStorage.getItem("GameVersion"));
      
      if(!GameVersionToDownload)
      {
        GameVersionToDownload = 0;
      }
      
      var gvtd = parseInt(localStorage.getItem("GameVersionToDownload"));
      
      if(gvtd > GameVersionToDownload)
      {
        GameVersionToDownload = gvtd;
      }
    }
    
    function IncreaseReadyCount()
    {
      readyCount++;
      
      if(readyCount >= scripts.length)
      {
        init();
      }
    }
    
    setTimeout(() => {
      var om = document.getElementById("offline_message");
      om.style.display = "initial";
    }, 5000);
  </script>
</body>
</html>
