<html>
  <head>
    <title>Carstorm!</title>
    <meta charset="utf-8" />
    
    <link rel="manifest" href="./app.webmanifest">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="carstorm.js"></script>
  </head>
<style>
  html, body
  {
    -webkit-user-select:none;
    background-color: #005500;
    overscroll-behavior-y: contain;
      
    touch-action: pan-x pan-y;
  }
  #canvas
  {
    position:absolute;
    top:0px;
    left:0px;
  }
  #top_canvas
  {
    position:absolute;
    top:0px;
    left:0px;
  }
</style>
<body onLoad="init();">
	<canvas id="canvas">
	</canvas>
  <canvas id="top_canvas">
	</canvas>
</body>
</html>
