<!DOCTYPE html>
<html>
  <head>
    <title>Carstorm!</title>
    <meta charset="utf-8" />
    
    <link rel="manifest" href="./app.webmanifest">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="button.js"></script>
    <script src="carstorm.js"></script>
  </head>
<style>
  html, body
  {
    -webkit-user-select:none;
    background-color: #005500;
    overscroll-behavior-y: contain;
      
    touch-action: pan-x pan-y;
  }
  @font-face
  {
    font-family: 'CarStormFont1';
    src: url('fonts/SkitserSwift.ttf');
    
  }
  @font-face
  {
    font-family: 'CarStormFont2';
    src: url('fonts/Snowstorm.ttf');
  }
  @font-face
  {
    font-family: 'CarStormFont3';
    src: url('fonts/Again.ttf');
  }
  #canvas, #street_canvas, #top_canvas
  {
    position:absolute;
    top:0px;
    left:0px;
  }
  #offline_message
  {
    color: white;
    font-size: 32px;
    display: none;
  }
</style>
<body onLoad="init();">
  <p id="offline_message">If nothing shows up, please make sure you are online the first time you start the game!</p>
	<canvas id="canvas"></canvas>
  <canvas id="street_canvas"></canvas>
  <canvas id="top_canvas"></canvas>
  
  <script>
    setTimeout(() => {
      // Nothing has been loaded for some time, are we offline?
      var om = document.getElementById("offline_message");
      om.style.display = "initial";
    }, 5000);
  </script>
</body>
</html>
