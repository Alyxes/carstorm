<html>
  <head>
    <title>Button!</title>
    <meta charset="utf-8" />        
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
<style>
  html, body
  {
    -webkit-user-select:none;
    background-color: #005500;
    overscroll-behavior-y: contain;
      
    touch-action: pan-x pan-y;
  }
  @font-face
  {
    font-family: 'CarStormFont1';
    src: url('fonts/SkitserSwift.ttf');
    
  }
  @font-face
  {
    font-family: 'CarStormFont2';
    src: url('fonts/Snowstorm.ttf');
  }
  @font-face
  {
    font-family: 'CarStormFont3';
    src: url('fonts/Again.ttf');
  }
  #canvas
  {
    position:absolute;
    background-color: white;
    top:0px;
    left:0px;
  }
</style>
<!--https://jsfiddle.net/robhawkes/gHCJt/-->
<body onLoad="doIt();">
	<canvas id="canvas"></canvas>
  
  <script>
  // TODO: Vi kan lägga in kod som väntar på att grafiken hunnit laddas, men vi har inte haft några problem med det ännu? 
  var InputModeButtonNormal = new Image();
  InputModeButtonNormal.src = "InputModeButtonNormal.png";
  var InputModeButtonLeft = new Image();
  InputModeButtonLeft.src = "InputModeButtonLeft.png";
  var InputModeButtonRight = new Image();
  InputModeButtonRight.src = "InputModeButtonRight.png";
  
  var InputModeImages = [InputModeButtonNormal,InputModeButtonLeft,InputModeButtonRight];
  var SelectedInputMode = 0; // 0:Normal,1:Left,2:Right
  
  var ScreenWidth = 0;
  var ScreenHeight = 0;

  var ctx = null;
  var button = null;
  
  document.addEventListener("mousedown", (e) => {
    e = e || window.event;
    
    if(e.button == 0) // Most of the time the left button
    {
      button.OnTouchStart(e.clientX, e.clientY);
    }
  });
  document.addEventListener("mouseup", (e) => {
    e = e || window.event;
    
    if(e.button == 0) // Most of the time the left button
    {
      button.OnTouchEnd(e.clientX, e.clientY);
    }
  });
  
  // Den här skickar vi med till knappen, som anropar denna funktion när man klickar på den.
  function SwitchInputMode()
  {
    SelectedInputMode++;
    
    if(SelectedInputMode > 2)
      SelectedInputMode = 0;
      
    return SelectedInputMode;
  }
  
  // Tanken med knappens alla selected-variablerna är att knappen ska växa och ändra färg när man pekar på den. (men det kan vi vänta med)
  //  <-Då behövs en animationLength och lite arbetsvariabler för det också, såvida den inte bara ska poppa upp till selected-size direkt.
  // Min idé är att settings-skärmen har tre knappar som den ritar ut i loopen, och som ett touch event checkar mot.
  //  Startskärmen har bara en knapp, settings, övrig yta startar spelet.
  //  ..Vi ska _inte_ använda knappar i spelet, de ska ju inte synas.
  
  function doIt()
  {
    ScreenWidth = window.innerWidth / 2;
    ScreenHeight = window.innerHeight / 2;

    var canvas = document.getElementById("canvas");
    ctx = canvas.getContext("2d");

    // Note; setting size in css above will totally skew the scale.
    canvas.height = ScreenHeight;
    canvas.width = ScreenWidth;
    
    // We want the button to be pretty big, take up a third of the screen width.
    var width = ScreenWidth / 3;

    // To keep aspect ratio the height depends on the given width.
    // https://stackoverflow.com/questions/10841532/canvas-drawimage-scaling
    var height = width * InputModeImages[SelectedInputMode].height / InputModeImages[SelectedInputMode].width;

    var cornerRadius = 40;
    var fillingInset = 40;
    var shadowBlur = 20;
    var strokeStyle = "rgba(255,128,255,0.5)";
    var fillStyle = "rgba(255,255,0,0.8)";
    var shadowColor = "rgba(255,0,255,1.0)";

    var selectedStrokeStyle = "rgba(255,0,0,0.5)";
    var selectedShadowColor = "rgba(0,0,255,1.0)";
    var selectedCornerRadius = cornerRadius + 10;
    var selectedShadowBlur = shadowBlur + 10;

    button = CreateButton(
      50, 50, width, height, 
      cornerRadius, fillingInset, shadowBlur, strokeStyle, 
      fillStyle, shadowColor, InputModeImages, selectedStrokeStyle, 
      selectedShadowColor, selectedCornerRadius, selectedShadowBlur, SwitchInputMode);
    
    GameLoop();
  }
  
  function GameLoop()
  {
    ctx.clearRect(0,0,ScreenWidth,ScreenHeight);
  
    button.Draw(ctx);

    // You can do the same thing with paths, like this triangle
    // Remember that a stroke will make the shape a bit larger so you'll need to fiddle with the
    // coordinates to get the correct dimensions.
    ctx.beginPath();
    ctx.moveTo(500, 100);
    ctx.lineTo(540, 160);
    ctx.lineTo(560, 160);
    ctx.closePath();
    ctx.stroke();
    ctx.fill();
    
    window.requestAnimationFrame(GameLoop);
  }
  
  function CreateButton(
    x, y, w, h, 
    cornerRadius, fillingInset, shadowBlur, strokeStyle, 
    fillStyle, shadowColor, imageArray, selectedStrokeStyle, 
    selectedShadowColor, selectedCornerRadius, selectedShadowBlur, callbackFunction)
  {
    // If there is an image, the buttons h will depend on the given w and the height of the image.
    if(imageArray != null)
    {
      h = w * imageArray[0].height / imageArray[0].width;
    }
    
    // fyfan...
    var button = {
      x:x,
      y:y,
      w:w,
      h:h,
      
      cornerRadius:cornerRadius,
      fillingInset:fillingInset,
      shadowBlur:shadowBlur,
      
      strokeStyle:strokeStyle,
      fillStyle:fillStyle,
      shadowColor:shadowColor,
      selectedStrokeStyle:selectedStrokeStyle,
      selectedShadowColor:selectedShadowColor,
      selectedCornerRadius:selectedCornerRadius,
      selectedShadowBlur:selectedShadowBlur,
      imageArray:imageArray,
      callbackFunction:callbackFunction,
      selectedImage:0,
      buttonPressed:false,
      
      // TODO: Resize() för resize screen event. 
      
      OnTouchStart: function(x,y) {
        // TODO: OBS, alla knappars OnTouchStart måste anropas, så får var o en avgöra om det är just de som blivit gnuggade på.
        if(x >= this.x && x <= this.x + this.w 
          && y >= this.y && y <= this.y + this.h)
        {
          this.buttonPressed = true;
          console.log("yey, someone's touching me!");
        }
      },
      
      OnTouchEnd: function(x,y) {
        // TODO: Samma, alla måste anropas när fingret lyfter igen eller nåt cancel event händer. (minimize, etc, var noggrann!)
        if(x >= this.x && x <= this.x + this.w 
          && y >= this.y && y <= this.y + this.h)
        {
          console.log("yey, a full click happened! Calling callbackFunction().");
          this.selectedImage = this.callbackFunction();
        }
        else if(this.buttonPressed)
        {
          // Att släppa upp fingret utanför knappen är ofint, men cancellerar i varje fall klicket.
          console.log("Halfway in...");
        }

        this.buttonPressed = false;
      },
            
      Draw: function(ctx) {
        // Reference rectangle without rounding, for size comparison
        //ctx.fillStyle = "black";
        //ctx.fillRect(rectX, rectY, rectWidth, rectHeight);

        // Det finns faktiskt inga knappar utan bild i vårt spel, så man kan inte heller ändra bakgrundsfärg för en nertryckt knapp.
        ctx.fillStyle = this.fillStyle;

        // bevel, round, miter. Bevel får mig att tänka på tintin. :)
        ctx.lineJoin = "round";   

        if(this.buttonPressed)
        {
          ctx.strokeStyle = this.selectedStrokeStyle;
          ctx.lineWidth = this.selectedCornerRadius;
          ctx.shadowColor = this.selectedShadowColor;
          ctx.shadowBlur = this.selectedShadowBlur;
        }
        else
        {
          ctx.strokeStyle = this.strokeStyle;
          ctx.lineWidth = this.cornerRadius;

          // The shadow goes for both filling and stroking...
          ctx.shadowColor = this.shadowColor;
          ctx.shadowBlur = this.shadowBlur;
        }
        
        // Change origin and dimensions to match true size (a stroke is drawn centered around the position given, so move it in a bit.)
        /*ctx.strokeRect(
          this.x+(this.cornerRadius/2), this.y+(this.cornerRadius/2), 
          this.w-this.cornerRadius, this.h-this.cornerRadius);*/

// TODO: Ser för jävligt ut eftersom de överlappar varann. :P 
        // Ändarna på linjer så heter det lineCap, lineJoin är jointen mellan två linjer.
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(this.x+(this.cornerRadius/2), this.y+(this.cornerRadius/2)+this.h-this.cornerRadius);
        ctx.lineTo(this.x+(this.cornerRadius/2), this.y+(this.cornerRadius/2));
        ctx.lineTo(this.x+(this.cornerRadius/2)+this.w-this.cornerRadius, this.y+(this.cornerRadius/2));
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(this.x+(this.cornerRadius/2)+this.w-this.cornerRadius, this.y+(this.cornerRadius/2));
        ctx.lineTo(this.x+(this.cornerRadius/2)+this.w-this.cornerRadius, this.y+(this.cornerRadius/2)+this.h-this.cornerRadius);
        ctx.lineTo(this.x+(this.cornerRadius/2), this.y+(this.cornerRadius/2)+this.h-this.cornerRadius);
        ctx.stroke();

        // ...so remove the shadow here.
        ctx.shadowBlur = 0;

        // The filling should be _inside_ the stroked outline, so move it down a bit and a bit smaller. 
        // ..Fast nu tyckte jag det blev snyggare om den gick över en bit. 
        ctx.fillRect(
          this.x+(this.fillingInset), this.y+(this.fillingInset), 
          this.w-this.fillingInset * 2, this.h-this.fillingInset * 2);

        // The image should have the size of the filling rectangle.
        ctx.drawImage(
          this.imageArray[this.selectedImage], 
          this.x+(this.fillingInset), this.y+(this.fillingInset), 
          this.w-this.fillingInset * 2, this.h-this.fillingInset * 2);
      },
    };
    
    return button;
  }
  
  </script>
</body>
</html>
